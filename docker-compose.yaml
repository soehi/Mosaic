services:
  mosaic-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: mosaic-server:latest
    ports:
      - "8080"
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      MOSAIC_DATA_DIR: /data
    # 可选：服务器上的 deploy/coolify.env（不提交仓库）可追加/覆盖环境变量；
    # 缺失时跳过，Coolify 面板 compose 编辑器里直接配置的 environment 同样生效。
    env_file:
      - path: ./deploy/coolify.env
        required: false
    volumes:
      - mosaic-data:/data
      - ./deploy:/opt/mosaic-mobile:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "Mosaic.Server.dll", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mosaic-data:
