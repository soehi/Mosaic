services:
  mosaic-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: mosaic-server:latest
    ports:
      - "8080"
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      MOSAIC_DATA_DIR: /data
    volumes:
      - mosaic-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "Mosaic.Server.dll", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mosaic-data:
